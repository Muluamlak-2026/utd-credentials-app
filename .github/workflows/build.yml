name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # No gradlew committed on purpose -- a hand-generated wrapper jar
      # transferred through Termux is exactly what corrupted the previous
      # build (see TERMUX_SETUP.md's "why no gradlew" note). This step
      # installs a real, verified Gradle distribution directly in the cloud
      # runner instead, so nothing binary ever has to survive a phone-side
      # zip/unzip round trip.
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: utd-credentials-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
